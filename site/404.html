<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>404 · Harshith Kantamneni</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#060708;--ink:#EEEFF1;--mid:#9398A0;--line:rgba(255,255,255,.08);
    --k:#FF6A4D;--i:#FFB454;--r:#41D6C3;--a:#6AA8FF;--sans:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  .topgrad{height:3px;background:linear-gradient(96deg,var(--k),var(--i) 33%,var(--r) 66%,var(--a))}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;gap:14px}
  .code{font-family:var(--mono);font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--mid)}
  h1{font-size:clamp(56px,12vw,120px);font-weight:600;letter-spacing:-.04em;line-height:1;background:linear-gradient(96deg,var(--k),var(--i) 33%,var(--r) 66%,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:var(--mid);max-width:420px;line-height:1.6;font-size:16px}
  .btn{margin-top:10px;font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:14px 22px;border-radius:12px;background:var(--ink);color:#08090a;font-weight:700;text-decoration:none;transition:transform .25s}
  .btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<div class="topgrad"></div>
<main>
  <div class="code">Error 404</div>
  <h1>404</h1>
  <p>That page does not exist, or it lived on the old site and has since been retired.</p>
  <a class="btn" href="/">← Back to harshithkantamneni.github.io</a>
</main>

</html>
