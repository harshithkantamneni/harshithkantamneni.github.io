name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs on pull requests too, so action updates get a dry run before deploying.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site (./site)
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  # Builds and checks the new site. It doesn't deploy until the cutover change points the build job at web/dist.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Refresh PR states
        working-directory: .
        run: node tools/fetch_prs.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build
        run: npm run build

      - name: Check numbers, wording, old URLs and links
        working-directory: .
        run: |
          python3 tools/check_claims.py
          python3 tools/check_site.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
